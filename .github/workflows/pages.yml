name: pages

# Publishes docs-site/ to GitHub Pages: the landing page at the site root
# and the docs under /docs.
on:
  pull_request:
    paths:
      - 'docs-site/**'
      - '.release-please-manifest.json'
      - '.github/workflows/pages.yml'
  push:
    paths:
      - 'docs-site/**'
      - '.release-please-manifest.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26.11.1'
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix docs-site

      - name: Check
        run: npm run check --prefix docs-site

      - name: Build
        env:
          # Optional: lets the landing page read the star count without the anonymous rate limit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build --prefix docs-site

      # Pagefind can be closed before it finishes writing on a slow disk, leaving empty
      # index files; never publish a site whose search is broken that way.
      - name: Check the search index
        run: |
          test -s docs-site/dist/pagefind/pagefind-entry.json
          test -z "$(find docs-site/dist/pagefind -maxdepth 1 -type f -empty)"

      - name: Upload Pages artifact
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          name: github-pages-${{ github.run_attempt }}
          path: docs-site/dist

  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
